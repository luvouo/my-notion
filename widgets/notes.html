<!-- =========================
  NOTES / MEMO WIDGET (COOL GRAY)
  - Cool gray palette
  - Transparent background
  - Responsive
  - Autosave localStorage
========================= -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memo — Soft Schedule</title>

  <style>
   :root{
  /* ✅ Cool Gray (slightly bluish gray) */
  --accent-1: rgba(210, 218, 228, 0.90);
  --accent-2: rgba(190, 200, 212, 0.55);
  --border: rgba(200, 208, 220, 0.62);

  --text: rgba(28, 30, 33, 0.92);
  --muted: rgba(28, 30, 33, 0.55);

  --glass: rgba(255,255,255,0.10);
  --shadow: 0 10px 30px rgba(0,0,0,0.06);
  --radius: 20px;

  /* ===== Design tokens (shared) ===== */
  --font-display: "EnterSanChaek", ui-sans-serif, system-ui, -apple-system,
    "Apple SD Gothic Neo","Noto Sans KR",sans-serif;

  --radius-card: 20px;
  --radius-control: 14px;
  --radius-pill: 999px;

  --gap-1: 8px;
  --gap-2: 10px;
  --gap-3: 12px;

  --stroke-strong: rgba(200,208,220,0.70);
  --stroke-soft: rgba(200,208,220,0.45);

  --bg-control: rgba(255,255,255,0.10);
  --bg-soft: rgba(255,255,255,0.06);

  --ring: 0 0 0 3px rgba(210,218,228,0.22);
  --ring-strong: 0 0 0 3px rgba(210,218,228,0.28);

  --h-control: 44px;
}

    @font-face{
      font-family: "EnterSanChaek";
      src: url("../fonts/엔터산책10.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    
    html, body{
      margin:0;
      padding:0;
      background: transparent;
      font-family: ui-sans-serif, system-ui, -apple-system,
        "Apple SD Gothic Neo","Noto Sans KR",sans-serif;
      color: var(--text);
    }

    .wrap{
      width: min(720px, 100%);
      margin: 0 auto;
      padding: clamp(10px, 2.6vw, 16px);
      box-sizing: border-box;
    }

    .card{
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(14px, 2.8vw, 18px);
      background: var(--glass);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(120% 80% at 0% 0%, rgba(210,218,228,0.22), transparent 55%),
        radial-gradient(80% 80% at 100% 20%, rgba(190,200,212,0.16), transparent 55%);
      pointer-events:none;
    }

    .inner{
      position: relative;
      z-index: 1;
      display: grid;
      gap: 12px;
    }

    .top{
      display:flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .title{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 0;
    }

    .pearl{
  width: 18px;
  height: 18px;
  border-radius: 999px;
  display: block;
  object-fit: cover;
  flex: 0 0 auto;
  box-shadow: 0 0 0 2px rgba(255,192,203,0.22);
    }

    .title h1{
  margin:0;
  font-family: var(--font-display);
  font-size: clamp(14px, 3.6vw, 16px);
  letter-spacing: -0.2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
    }

    .meta{
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .richWrap{ display:grid; gap:8px; min-width:0; }
    .richToolbar{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .richBtn,
    .richSelect{
      min-height: 30px;
      border: 1px solid var(--stroke-soft);
      background: rgba(255,255,255,0.18);
      color: rgba(28,30,33,0.72);
      border-radius: var(--radius-pill);
      padding: 5px 9px;
      font: 12px var(--font-display);
      box-sizing: border-box;
    }
    .richBtn{ cursor:pointer; min-width:30px; }
    .richSelect{ max-width:150px; min-width:0; }
    .richBtn:hover,
    .richSelect:hover{ border-color: var(--stroke-strong); }
    .richEditor{
      width: 100%;
      min-height: 160px;
      border-radius: 14px;
      border: 1px solid rgba(200,208,220,0.55);
      background: rgba(255,255,255,0.12);
      padding: 12px;
      font-size: 14px;
      color: var(--text);
      font-family: inherit;
      outline: none;
      box-sizing: border-box;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .richEditor:empty::before{
      content: attr(data-placeholder);
      color: rgba(28,30,33,0.45);
      pointer-events:none;
    }
    .gateRow{ display:flex; gap:8px; flex-wrap:wrap; }
    .gateInput{
      flex:1 1 180px;
      min-width:0;
      border:1px solid var(--stroke-soft);
      background:rgba(255,255,255,0.12);
      border-radius:var(--radius-control);
      padding:10px 12px;
      outline:none;
      box-sizing:border-box;
    }

    .footer{
      display:flex;
      justify-content: space-between;
      align-items:center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
    }

    .linkBtn{
    border: 1px solid rgba(200,208,220,0.55);
    background: rgba(255,255,255,0.08);
    padding: 8px 10px;
    border-radius: 12px;
    cursor:pointer;
    transition: background .2s ease;
    -webkit-tap-highlight-color: transparent;
  
    font-family: var(--font-display);
    font-size: 12px;
    }
    .linkBtn:hover{ background: rgba(255,255,255,0.14); }

    @media (max-width: 360px){
      .meta{ display:none; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card" role="application" aria-label="Memo Widget">
      <div class="inner">
        <div class="top">
          <div class="title">
            <img class="pearl" src="./icon/pearl.png" alt="" aria-hidden="true" />
            <h1>Memo</h1>
          </div>
          <div class="meta" id="metaText"></div>
        </div>

        <div class="richWrap">
          <div class="richToolbar" id="richToolbar">
            <button class="richBtn" type="button" data-rich-command="bold" aria-label="Bold"><strong>B</strong></button>
            <button class="richBtn" type="button" data-rich-command="italic" aria-label="Italic"><em>I</em></button>
            <button class="richBtn" type="button" data-rich-command="underline" aria-label="Underline"><u>U</u></button>
            <button class="richBtn" type="button" data-rich-command="strikeThrough" aria-label="Strikethrough"><s>S</s></button>
            <select class="richSelect" id="fontSelect" aria-label="Font family">
              <option value="inherit">Default / System</option>
              <option value='"EnterSanChaek", ui-sans-serif, system-ui, sans-serif'>EnterSanChaek</option>
              <option value="Georgia, 'Times New Roman', serif">Serif</option>
              <option value="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Monospace</option>
            </select>
            <select class="richSelect" id="sizeSelect" aria-label="Font size">
              <option value="">Size</option>
              <option value="12px">12px</option><option value="14px">14px</option>
              <option value="16px">16px</option><option value="18px">18px</option><option value="20px">20px</option>
            </select>
            <button class="richBtn" type="button" data-rich-command="removeFormat">Clear</button>
          </div>
          <div class="richEditor" id="notes" contenteditable="true" role="textbox" aria-multiline="true"
            data-placeholder="짧은 메모, 컨디션, 주의사항…"></div>
        </div>

        <div class="footer">
          <span id="status">자동 저장</span>
          <button class="linkBtn" id="clearBtn" type="button">Clear</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../env.js"></script>
  <script type="module">
  (async function main(){
    let USE_SUPABASE = false;
    let workspace_id = "local";
    let sbFetch = null;
    let syncError = false;

    async function renderPasscodeGate(savePasscode){
      const wrap = document.querySelector(".wrap");
      if(!wrap) return;
      wrap.innerHTML = `
        <div class="card" role="application" aria-label="Passcode Gate">
          <div class="inner" style="gap:10px;">
            <div class="top">
              <div class="title"><img class="pearl" src="./icon/pearl.png" alt="" aria-hidden="true" /><h1>Passcode</h1></div>
              <div class="meta">sync</div>
            </div>
            <div class="gateRow">
              <input id="passInput" class="gateInput" type="password" placeholder="패스코드 입력…" />
              <button class="linkBtn" id="passBtn" type="button">확인</button>
            </div>
            <div style="font-size:12px; color:var(--muted); line-height:1.4;">같은 패스코드를 쓰는 모든 위젯과 기기가 같은 workspace를 사용해.</div>
          </div>
        </div>`;
      const input = document.getElementById("passInput");
      const submit = () => {
        const pass = (input.value || "").trim();
        if(!pass) return;
        savePasscode(pass);
        location.reload();
      };
      document.getElementById("passBtn").addEventListener("click", submit);
      input.addEventListener("keydown", e => { if(e.key === "Enter") submit(); });
    }

    try{
      const auth = await import("../core/auth-lite.js");
      const supa = await import("../core/supabase-rest.js");
      const ws = await auth.getWorkspaceId();
      if(!ws){
        await renderPasscodeGate(auth.savePasscode);
        return;
      }
      workspace_id = ws;
      sbFetch = supa.sbFetch;
      USE_SUPABASE = true;
    }catch(err){
      console.warn("[Notes Widget] Supabase unavailable. Falling back to localStorage.", err);
    }

    function ymd(d=new Date()){
      const y=d.getFullYear();
      const m=String(d.getMonth()+1).padStart(2,"0");
      const day=String(d.getDate()).padStart(2,"0");
      return `${y}.${m}.${day}`;
    }
    const metaText = document.getElementById("metaText");

    const RICH_STORAGE_KEY = USE_SUPABASE ? `soft_schedule_notes_rich_${workspace_id}_v1` : "soft_schedule_notes_rich_v1";
    const STORAGE_KEY = USE_SUPABASE ? `soft_schedule_notes_${workspace_id}_v1` : "soft_schedule_notes_v1";
    const NOTES_WIDGET_KEY = "notes_v1";
    const editor = document.getElementById("notes");
    const toolbar = document.getElementById("richToolbar");
    const fontSelect = document.getElementById("fontSelect");
    const sizeSelect = document.getElementById("sizeSelect");
    const status = document.getElementById("status");
    const clearBtn = document.getElementById("clearBtn");
    let lastRemoteUpdatedAt = "";
    let localMutationVersion = 0;
    let syncedMutationVersion = 0;
    let pendingSave = false;
    let remoteSaveInFlight = 0;
    let remoteRefreshInFlight = false;

    const RICH_TAGS = new Set(["STRONG","B","EM","I","U","S","SPAN","BR","DIV"]);
    const RICH_FONTS = new Set([
      "inherit",
      '"EnterSanChaek", ui-sans-serif, system-ui, sans-serif',
      "Georgia, 'Times New Roman', serif",
      "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    ]);
    const RICH_SIZES = new Set(["12px","14px","16px","18px","20px"]);
    let savedRange = null;

    function sanitizeRichHtml(html){
      const template = document.createElement("template");
      template.innerHTML = String(html || "");
      const cleanNode = node => {
        if(node.nodeType === Node.TEXT_NODE){
          return document.createTextNode(node.nodeValue.replace(/\u200B/g, ""));
        }
        if(node.nodeType !== Node.ELEMENT_NODE) return document.createDocumentFragment();
        const tag = node.tagName.toUpperCase();
        if(["SCRIPT","STYLE","IFRAME","OBJECT","EMBED","LINK","META"].includes(tag)){
          return document.createDocumentFragment();
        }
        if(!RICH_TAGS.has(tag)){
          const fragment = document.createDocumentFragment();
          [...node.childNodes].forEach(child => fragment.appendChild(cleanNode(child)));
          return fragment;
        }
        const clean = document.createElement(tag.toLowerCase());
        if(tag === "SPAN"){
          const family = node.style.fontFamily;
          const size = node.style.fontSize;
          const weight = node.style.fontWeight;
          const style = node.style.fontStyle;
          const decoration = node.style.textDecoration;
          if(RICH_FONTS.has(family)) clean.style.fontFamily = family;
          if(RICH_SIZES.has(size)) clean.style.fontSize = size;
          if(["bold","700"].includes(weight)) clean.style.fontWeight = "bold";
          if(style === "italic") clean.style.fontStyle = "italic";
          if(["underline","line-through"].includes(decoration)) clean.style.textDecoration = decoration;
        }
        [...node.childNodes].forEach(child => clean.appendChild(cleanNode(child)));
        return clean;
      };
      const output = document.createElement("div");
      [...template.content.childNodes].forEach(node => output.appendChild(cleanNode(node)));
      return output.innerHTML;
    }
    function plainText(){
      return String(editor.innerText || "").replace(/\u200B/g, "").replace(/\n+$/, "");
    }
    function plainTextToRichHtml(text){
      const div = document.createElement("div");
      div.textContent = String(text || "");
      return div.innerHTML.replace(/\r?\n/g, "<br>");
    }
    function saveSelection(){
      const selection = window.getSelection();
      if(!selection || !selection.rangeCount) return;
      const range = selection.getRangeAt(0);
      if(editor.contains(range.commonAncestorContainer)) savedRange = range.cloneRange();
    }
    function restoreSelection(){
      if(!savedRange) return false;
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(savedRange);
      return true;
    }
    function applyStyle(property, value){
      editor.focus();
      if(!restoreSelection()) return;
      const selection = window.getSelection();
      const range = selection.getRangeAt(0);
      const span = document.createElement("span");
      span.style[property] = value;
      if(range.collapsed){
        span.textContent = "\u200B";
        range.insertNode(span);
        range.setStart(span.firstChild, 1);
        range.collapse(true);
      }else{
        span.appendChild(range.extractContents());
        range.insertNode(span);
        range.selectNodeContents(span);
      }
      selection.removeAllRanges();
      selection.addRange(range);
      savedRange = range.cloneRange();
      editor.dispatchEvent(new Event("input", { bubbles:true }));
    }
    function runCommand(command){
      editor.focus();
      restoreSelection();
      document.execCommand(command, false, null);
      saveSelection();
      editor.dispatchEvent(new Event("input", { bubbles:true }));
    }

    function updateMeta(){
      const syncMeta = USE_SUPABASE && !syncError ? `서버 · ${workspace_id.slice(0,8)}` : "로컬";
      metaText.textContent = `${ymd()} · ${syncMeta}`;
    }
    function loadLocal(){
      try{
        const rich = localStorage.getItem(RICH_STORAGE_KEY);
        if(rich !== null){
          editor.innerHTML = sanitizeRichHtml(rich);
          return;
        }
        const plain = localStorage.getItem(STORAGE_KEY);
        if(plain !== null) editor.innerHTML = plainTextToRichHtml(plain);
      }catch(e){}
    }
    function currentPayload(){
      return { html:sanitizeRichHtml(editor.innerHTML), text:plainText() };
    }
    function persistLocal(payload){
      localStorage.setItem(RICH_STORAGE_KEY, payload.html);
      localStorage.setItem(STORAGE_KEY, payload.text);
    }
    async function saveRemote(payload, version){
      if(!USE_SUPABASE || !sbFetch) return false;
      remoteSaveInFlight += 1;
      try{
        const updatedAt = new Date().toISOString();
        const rows = await sbFetch("widget_state?on_conflict=workspace_id,widget_key", {
          method:"POST",
          body:[{ workspace_id, widget_key:NOTES_WIDGET_KEY, payload, updated_at:updatedAt }],
          prefer:"return=representation,resolution=merge-duplicates"
        });
        lastRemoteUpdatedAt = (rows && rows[0] && rows[0].updated_at) || updatedAt;
        syncedMutationVersion = Math.max(syncedMutationVersion, version);
        syncError = false;
        return true;
      }catch(err){
        syncError = true;
        console.warn("[Notes Widget] Remote save failed; local cache is safe.", err);
        return false;
      }finally{
        remoteSaveInFlight = Math.max(0, remoteSaveInFlight - 1);
        updateMeta();
      }
    }
    async function save(){
      pendingSave = false;
      const payload = currentPayload();
      try{
        persistLocal(payload);
      }catch(e){
        status.textContent = "저장 실패";
        return;
      }
      localMutationVersion += 1;
      const version = localMutationVersion;
      while(remoteSaveInFlight){
        await new Promise(resolve => setTimeout(resolve, 50));
      }
      const saved = USE_SUPABASE ? await saveRemote(payload, version) : true;
      status.textContent = saved ? "저장됨" : "서버 저장 실패 · 로컬 저장됨";
      clearTimeout(save._t);
      save._t = setTimeout(() => status.textContent = saved ? "자동 저장" : "서버 저장 실패 · 로컬 저장됨", 900);
    }
    async function loadRemoteState(){
      return sbFetch("widget_state", { query:{
        select:"payload,updated_at",
        workspace_id:`eq.${workspace_id}`,
        widget_key:`eq.${NOTES_WIDGET_KEY}`,
        limit:"1"
      }});
    }
    function applyRemoteRow(row){
      const payload = row && row.payload;
      if(!payload || typeof payload !== "object") return false;
      const html = typeof payload.html === "string"
        ? sanitizeRichHtml(payload.html)
        : plainTextToRichHtml(payload.text || "");
      editor.innerHTML = html;
      const localPayload = { html, text:typeof payload.text === "string" ? payload.text : plainText() };
      persistLocal(localPayload);
      lastRemoteUpdatedAt = row.updated_at || lastRemoteUpdatedAt;
      savedRange = null;
      return true;
    }
    function canApplyRemote(){
      return document.activeElement !== editor && !pendingSave && !remoteSaveInFlight && localMutationVersion === syncedMutationVersion;
    }
    async function bootstrapSync(){
      if(!USE_SUPABASE || !sbFetch) return;
      try{
        const rows = await loadRemoteState();
        if(rows && rows.length){
          applyRemoteRow(rows[0]);
          syncedMutationVersion = localMutationVersion;
          syncError = false;
        }else{
          await saveRemote(currentPayload(), localMutationVersion);
        }
      }catch(err){
        syncError = true;
        console.warn("[Notes Widget] Initial remote load failed; using local cache.", err);
      }
      updateMeta();
    }
    async function refreshFromRemote(){
      if(!USE_SUPABASE || !sbFetch || remoteRefreshInFlight || !canApplyRemote()) return;
      remoteRefreshInFlight = true;
      try{
        const rows = await loadRemoteState();
        const row = rows && rows[0];
        if(row && (!lastRemoteUpdatedAt || row.updated_at > lastRemoteUpdatedAt)) applyRemoteRow(row);
        syncError = false;
      }catch(err){
        syncError = true;
        console.warn("[Notes Widget] Remote refresh failed; keeping local cache.", err);
      }finally{
        remoteRefreshInFlight = false;
        updateMeta();
      }
    }

    let t = null;
    editor.addEventListener("input", () => {
      status.textContent = "입력 중…";
      clearTimeout(t);
      pendingSave = true;
      t = setTimeout(save, 350);
    });

    document.addEventListener("selectionchange", saveSelection);
    editor.addEventListener("mouseup", saveSelection);
    editor.addEventListener("keyup", saveSelection);
    editor.addEventListener("paste", (e) => {
      e.preventDefault();
      document.execCommand("insertText", false, e.clipboardData.getData("text/plain"));
    });
    toolbar.addEventListener("pointerdown", (e) => {
      saveSelection();
      if(e.target.closest("button")) e.preventDefault();
    });
    toolbar.addEventListener("click", (e) => {
      const button = e.target.closest("[data-rich-command]");
      if(button) runCommand(button.dataset.richCommand);
    });
    fontSelect.addEventListener("change", () => applyStyle("fontFamily", fontSelect.value));
    sizeSelect.addEventListener("change", () => {
      if(sizeSelect.value) applyStyle("fontSize", sizeSelect.value);
      sizeSelect.value = "";
    });

    clearBtn.addEventListener("click", () => {
      clearTimeout(t);
      pendingSave = false;
      editor.innerHTML = "";
      savedRange = null;
      save();
    });

    loadLocal();
    await bootstrapSync();
    updateMeta();
    status.textContent = "자동 저장";

    const REMOTE_REFRESH_INTERVAL_MS = 15000;
    setInterval(() => {
      if(document.visibilityState === "visible") refreshFromRemote();
    }, REMOTE_REFRESH_INTERVAL_MS);
    document.addEventListener("visibilitychange", () => {
      if(document.visibilityState === "visible") refreshFromRemote();
    });
    window.addEventListener("focus", refreshFromRemote);
    window.addEventListener("pageshow", refreshFromRemote);
  })();
  </script>
</body>
</html>
