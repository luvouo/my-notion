<!-- =========================
  NOTES / MEMO WIDGET (COOL GRAY)
  - Cool gray palette
  - Transparent background
  - Responsive
  - Autosave localStorage
========================= -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memo — Soft Schedule</title>

  <style>
   :root{
  /* ✅ Cool Gray (slightly bluish gray) */
  --accent-1: rgba(210, 218, 228, 0.90);
  --accent-2: rgba(190, 200, 212, 0.55);
  --border: rgba(200, 208, 220, 0.62);

  --text: rgba(28, 30, 33, 0.92);
  --muted: rgba(28, 30, 33, 0.55);

  --glass: rgba(255,255,255,0.10);
  --shadow: 0 10px 30px rgba(0,0,0,0.06);
  --radius: 20px;

  /* ===== Design tokens (shared) ===== */
  --font-display: "EnterSanChaek", ui-sans-serif, system-ui, -apple-system,
    "Apple SD Gothic Neo","Noto Sans KR",sans-serif;

  --radius-card: 20px;
  --radius-control: 14px;
  --radius-pill: 999px;

  --gap-1: 8px;
  --gap-2: 10px;
  --gap-3: 12px;

  --stroke-strong: rgba(200,208,220,0.70);
  --stroke-soft: rgba(200,208,220,0.45);

  --bg-control: rgba(255,255,255,0.10);
  --bg-soft: rgba(255,255,255,0.06);

  --ring: 0 0 0 3px rgba(210,218,228,0.22);
  --ring-strong: 0 0 0 3px rgba(210,218,228,0.28);

  --h-control: 44px;
}

    @font-face{
      font-family: "EnterSanChaek";
      src: url("../fonts/엔터산책10.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    
    html, body{
      margin:0;
      padding:0;
      background: transparent;
      font-family: ui-sans-serif, system-ui, -apple-system,
        "Apple SD Gothic Neo","Noto Sans KR",sans-serif;
      color: var(--text);
    }

    .wrap{
      width: min(720px, 100%);
      margin: 0 auto;
      padding: clamp(10px, 2.6vw, 16px);
      box-sizing: border-box;
    }

    .card{
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(14px, 2.8vw, 18px);
      background: var(--glass);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(120% 80% at 0% 0%, rgba(210,218,228,0.22), transparent 55%),
        radial-gradient(80% 80% at 100% 20%, rgba(190,200,212,0.16), transparent 55%);
      pointer-events:none;
    }

    .inner{
      position: relative;
      z-index: 1;
      display: grid;
      gap: 12px;
    }

    .top{
      display:flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .title{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 0;
    }

    .pearl{
  width: 18px;
  height: 18px;
  border-radius: 999px;
  display: block;
  object-fit: cover;
  flex: 0 0 auto;
  box-shadow: 0 0 0 2px rgba(255,192,203,0.22);
    }

    .title h1{
  margin:0;
  font-family: var(--font-display);
  font-size: clamp(14px, 3.6vw, 16px);
  letter-spacing: -0.2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
    }

    .meta{
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .richWrap{ display:grid; gap:8px; min-width:0; }
    .richToolbar{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .richBtn,
    .richSelect{
      min-height: 30px;
      border: 1px solid var(--stroke-soft);
      background: rgba(255,255,255,0.18);
      color: rgba(28,30,33,0.72);
      border-radius: var(--radius-pill);
      padding: 5px 9px;
      font: 12px var(--font-display);
      box-sizing: border-box;
    }
    .richBtn{ cursor:pointer; min-width:30px; }
    .richSelect{ max-width:150px; min-width:0; }
    .richBtn:hover,
    .richSelect:hover{ border-color: var(--stroke-strong); }
    .richBtn.active{
      background: rgba(210,218,228,0.34);
      border-color: rgba(190,200,212,0.82);
      box-shadow: 0 0 0 2px rgba(210,218,228,0.14);
    }
    .richEditor{
      width: 100%;
      min-height: 160px;
      border-radius: 14px;
      border: 1px solid rgba(200,208,220,0.55);
      background: rgba(255,255,255,0.12);
      padding: 12px;
      font-size: 12px;
      color: var(--text);
      font-family: inherit;
      outline: none;
      box-sizing: border-box;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .richEditor:empty::before{
      content: attr(data-placeholder);
      color: rgba(28,30,33,0.45);
      pointer-events:none;
    }
    .gateRow{ display:flex; gap:8px; flex-wrap:wrap; }
    .gateInput{
      flex:1 1 180px;
      min-width:0;
      border:1px solid var(--stroke-soft);
      background:rgba(255,255,255,0.12);
      border-radius:var(--radius-control);
      padding:10px 12px;
      outline:none;
      box-sizing:border-box;
    }

    .footer{
      display:flex;
      justify-content: space-between;
      align-items:center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
    }

    .linkBtn{
    border: 1px solid rgba(200,208,220,0.55);
    background: rgba(255,255,255,0.08);
    padding: 8px 10px;
    border-radius: 12px;
    cursor:pointer;
    transition: background .2s ease;
    -webkit-tap-highlight-color: transparent;
  
    font-family: var(--font-display);
    font-size: 12px;
    }
    .linkBtn:hover{ background: rgba(255,255,255,0.14); }

    @media (max-width: 360px){
      .meta{ display:none; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card" role="application" aria-label="Memo Widget">
      <div class="inner">
        <div class="top">
          <div class="title">
            <img class="pearl" src="./icon/pearl.png" alt="" aria-hidden="true" />
            <h1>Memo</h1>
          </div>
          <div class="meta" id="metaText"></div>
        </div>

        <div class="richWrap">
          <div class="richToolbar" id="richToolbar">
            <button class="richBtn" type="button" data-rich-command="bold" aria-label="Bold"><strong>B</strong></button>
            <button class="richBtn" type="button" data-rich-command="italic" aria-label="Italic"><em>I</em></button>
            <button class="richBtn" type="button" data-rich-command="underline" aria-label="Underline"><u>U</u></button>
            <button class="richBtn" type="button" data-rich-command="strikeThrough" aria-label="Strikethrough"><s>S</s></button>
            <select class="richSelect" id="fontSelect" aria-label="Font family">
              <option value="inherit">Default / System</option>
              <option value='"EnterSanChaek", ui-sans-serif, system-ui, sans-serif'>EnterSanChaek</option>
              <option value="Georgia, 'Times New Roman', serif">Serif</option>
              <option value="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Monospace</option>
            </select>
            <select class="richSelect" id="sizeSelect" aria-label="Font size">
              <option value="10px">10px</option>
              <option value="12px">12px</option><option value="14px">14px</option>
              <option value="16px">16px</option><option value="18px">18px</option><option value="20px">20px</option>
            </select>
            <button class="richBtn" type="button" data-rich-command="insertUnorderedList" aria-label="Bulleted list">• List</button>
            <button class="richBtn" type="button" data-rich-command="insertOrderedList" aria-label="Numbered list">1. List</button>
            <button class="richBtn" type="button" data-rich-command="undo" aria-label="Undo">↶</button>
            <button class="richBtn" type="button" data-rich-command="redo" aria-label="Redo">↷</button>
            <button class="richBtn" type="button" data-rich-command="removeFormat">Reset</button>
          </div>
          <div class="richEditor" id="notes" contenteditable="true" role="textbox" aria-multiline="true"
            data-placeholder="짧은 메모, 컨디션, 주의사항…"></div>
        </div>

        <div class="footer">
          <span id="status">자동 저장</span>
          <button class="linkBtn" id="saveBtn" type="button">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../env.js"></script>
  <script type="module">
  (async function main(){
    let USE_SUPABASE = false;
    let workspace_id = "local";
    let sbFetch = null;
    let syncError = false;

    async function renderPasscodeGate(savePasscode){
      const wrap = document.querySelector(".wrap");
      if(!wrap) return;
      wrap.innerHTML = `
        <div class="card" role="application" aria-label="Passcode Gate">
          <div class="inner" style="gap:10px;">
            <div class="top">
              <div class="title"><img class="pearl" src="./icon/pearl.png" alt="" aria-hidden="true" /><h1>Passcode</h1></div>
              <div class="meta">sync</div>
            </div>
            <div class="gateRow">
              <input id="passInput" class="gateInput" type="password" placeholder="패스코드 입력…" />
              <button class="linkBtn" id="passBtn" type="button">확인</button>
            </div>
            <div style="font-size:12px; color:var(--muted); line-height:1.4;">같은 패스코드를 쓰는 모든 위젯과 기기가 같은 workspace를 사용해.</div>
          </div>
        </div>`;
      const input = document.getElementById("passInput");
      const submit = () => {
        const pass = (input.value || "").trim();
        if(!pass) return;
        savePasscode(pass);
        location.reload();
      };
      document.getElementById("passBtn").addEventListener("click", submit);
      input.addEventListener("keydown", e => { if(e.key === "Enter") submit(); });
    }

    try{
      const auth = await import("../core/auth-lite.js");
      const supa = await import("../core/supabase-rest.js");
      const ws = await auth.getWorkspaceId();
      if(!ws){
        await renderPasscodeGate(auth.savePasscode);
        return;
      }
      workspace_id = ws;
      sbFetch = supa.sbFetch;
      USE_SUPABASE = true;
    }catch(err){
      console.warn("[Notes Widget] Supabase unavailable. Falling back to localStorage.", err);
    }

    function ymd(d=new Date()){
      const y=d.getFullYear();
      const m=String(d.getMonth()+1).padStart(2,"0");
      const day=String(d.getDate()).padStart(2,"0");
      return `${y}.${m}.${day}`;
    }
    const metaText = document.getElementById("metaText");

    const RICH_STORAGE_KEY = USE_SUPABASE ? `soft_schedule_notes_rich_${workspace_id}_v1` : "soft_schedule_notes_rich_v1";
    const STORAGE_KEY = USE_SUPABASE ? `soft_schedule_notes_${workspace_id}_v1` : "soft_schedule_notes_v1";
    const NOTES_WIDGET_KEY = "notes_v1";
    const editor = document.getElementById("notes");
    const toolbar = document.getElementById("richToolbar");
    const fontSelect = document.getElementById("fontSelect");
    const sizeSelect = document.getElementById("sizeSelect");
    const status = document.getElementById("status");
    const saveBtn = document.getElementById("saveBtn");
    let lastRemoteUpdatedAt = "";
    let localMutationVersion = 0;
    let syncedMutationVersion = 0;
    let pendingSave = false;
    let remoteSaveInFlight = 0;
    let remoteRefreshInFlight = false;

    const RICH_FONTS = {
      system: "inherit",
      walk: '"EnterSanChaek", ui-sans-serif, system-ui, sans-serif',
      serif: "Georgia, 'Times New Roman', serif",
      mono: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    };
    const RICH_SIZES = new Set(["10px","12px","14px","16px","18px","20px"]);
    let savedRange = null;

    function canonicalFont(value){
      const lower = String(value || "").replace(/[\"']/g, "").toLowerCase();
      if(lower.includes("entersanchaek")) return RICH_FONTS.walk;
      if(lower.includes("ui-monospace") || lower.includes("sfmono") || lower.includes("menlo") || lower.includes("consolas") || lower === "monospace") return RICH_FONTS.mono;
      if(lower.includes("georgia") || lower.includes("times new roman") || lower === "serif") return RICH_FONTS.serif;
      return "";
    }
    function canonicalSize(value){
      const match = String(value || "").match(/(10|12|14|16|18|20)px/i);
      return match && RICH_SIZES.has(`${match[1]}px`) ? `${match[1]}px` : "";
    }
    function legacyFontSize(value){
      return ({"1":"10px","2":"12px","3":"14px","4":"16px","5":"18px","6":"20px","7":"20px"})[String(value || "")] || "";
    }
    function normalizeRichHtml(html){
      const template = document.createElement("template");
      template.innerHTML = String(html || "");
      const output = document.createElement("div");
      const baseState = { bold:false, italic:false, underline:false, strike:false, font:"", size:"" };
      const dangerous = new Set(["SCRIPT","STYLE","IFRAME","OBJECT","EMBED","LINK","META","IMG","SVG","MATH"]);

      const appendTextRun = (parent, text, state) => {
        const value = String(text || "").replace(/\u200B/g, "");
        if(!value) return;
        let node = document.createTextNode(value);
        if(state.font || state.size){
          const span = document.createElement("span");
          if(state.font) span.style.fontFamily = state.font;
          if(state.size) span.style.fontSize = state.size;
          span.appendChild(node);
          node = span;
        }
        if(state.strike){ const el=document.createElement("s"); el.appendChild(node); node=el; }
        if(state.underline){ const el=document.createElement("u"); el.appendChild(node); node=el; }
        if(state.italic){ const el=document.createElement("em"); el.appendChild(node); node=el; }
        if(state.bold){ const el=document.createElement("strong"); el.appendChild(node); node=el; }
        parent.appendChild(node);
      };

      const visit = (node, parent, inherited) => {
        if(node.nodeType === Node.TEXT_NODE){ appendTextRun(parent, node.nodeValue, inherited); return; }
        if(node.nodeType !== Node.ELEMENT_NODE) return;
        const tag = node.tagName.toUpperCase();
        if(dangerous.has(tag)) return;
        if(tag === "BR"){ parent.appendChild(document.createElement("br")); return; }
        if(["DIV","P","UL","OL","LI"].includes(tag)){
          const canonicalTag = tag === "P" ? "div" : tag.toLowerCase();
          const block = document.createElement(canonicalTag);
          [...node.childNodes].forEach(child => visit(child, block, {...inherited}));
          parent.appendChild(block);
          return;
        }

        const state = {...inherited};
        if(tag === "STRONG" || tag === "B") state.bold = true;
        if(tag === "EM" || tag === "I") state.italic = true;
        if(tag === "U") state.underline = true;
        if(tag === "S" || tag === "STRIKE" || tag === "DEL") state.strike = true;
        if(tag === "FONT"){
          if(node.hasAttribute("face")) state.font = canonicalFont(node.getAttribute("face"));
          state.size = canonicalSize(node.style.fontSize) || legacyFontSize(node.getAttribute("size")) || state.size;
        }
        if(tag === "SPAN" || tag === "FONT"){
          if(node.style.fontFamily) state.font = canonicalFont(node.style.fontFamily);
          state.size = canonicalSize(node.style.fontSize) || state.size;
          const weight = node.style.fontWeight;
          const decoration = `${node.style.textDecoration} ${node.style.textDecorationLine}`;
          if(weight === "bold" || Number(weight) >= 600) state.bold = true;
          if(weight === "normal" || weight === "400") state.bold = false;
          if(node.style.fontStyle === "italic") state.italic = true;
          if(node.style.fontStyle === "normal") state.italic = false;
          if(decoration.includes("none")){ state.underline = false; state.strike = false; }
          if(decoration.includes("underline")) state.underline = true;
          if(decoration.includes("line-through")) state.strike = true;
        }
        [...node.childNodes].forEach(child => visit(child, parent, state));
      };

      [...template.content.childNodes].forEach(node => visit(node, output, {...baseState}));
      return output.innerHTML;
    }
    function sanitizeRichHtml(html){
      return normalizeRichHtml(html);
    }
    function plainText(){
      return String(editor.innerText || "").replace(/\u200B/g, "").replace(/\n+$/, "");
    }
    function plainTextToRichHtml(text){
      const div = document.createElement("div");
      div.textContent = String(text || "");
      return normalizeRichHtml(div.innerHTML.replace(/\r?\n/g, "<br>"));
    }
    function selectionInsideEditor(range){
      return !!range && editor.contains(range.commonAncestorContainer);
    }
    function saveSelection(){
      const selection = window.getSelection();
      if(!selection || !selection.rangeCount) return;
      const range = selection.getRangeAt(0);
      if(selectionInsideEditor(range)) savedRange = range.cloneRange();
    }
    function restoreSelection(){
      if(!savedRange || !selectionInsideEditor(savedRange)) return false;
      try{
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(savedRange);
        return true;
      }catch(_){
        savedRange = null;
        return false;
      }
    }
    function selectionElement(){
      const selection = window.getSelection();
      if(!selection || !selection.rangeCount) return editor;
      let node = selection.anchorNode;
      if(node && node.nodeType === Node.TEXT_NODE) node = node.parentElement;
      return node && editor.contains(node) ? node : editor;
    }
    function fontSelectValue(value){
      return canonicalFont(value) || RICH_FONTS.system;
    }
    function sizeSelectValue(value){
      const px = `${Math.round(parseFloat(value) || 12)}px`;
      return RICH_SIZES.has(px) ? px : "12px";
    }
    function updateToolbarState(){
      const selection = window.getSelection();
      if(!selection || !selection.rangeCount || !selectionInsideEditor(selection.getRangeAt(0))) return;
      const states = {
        bold: document.queryCommandState("bold"),
        italic: document.queryCommandState("italic"),
        underline: document.queryCommandState("underline"),
        strikeThrough: document.queryCommandState("strikeThrough"),
        insertUnorderedList: document.queryCommandState("insertUnorderedList"),
        insertOrderedList: document.queryCommandState("insertOrderedList")
      };
      toolbar.querySelectorAll("[data-rich-command]").forEach(button => {
        button.classList.toggle("active", !!states[button.dataset.richCommand]);
        button.setAttribute("aria-pressed", states[button.dataset.richCommand] ? "true" : "false");
      });
      const computed = getComputedStyle(selectionElement());
      fontSelect.value = fontSelectValue(computed.fontFamily);
      sizeSelect.value = sizeSelectValue(computed.fontSize);
    }
    function notifyFormattingChange(){
      saveSelection();
      updateToolbarState();
      editor.dispatchEvent(new Event("input", { bubbles:true }));
    }
    function runCommand(command, value=null){
      editor.focus();
      if(!restoreSelection()) return;
      document.execCommand("styleWithCSS", false, false);
      document.execCommand(command, false, value);
      notifyFormattingChange();
    }
    function applyFont(font){
      runCommand("fontName", font === RICH_FONTS.system ? "inherit" : font);
    }
    function applySize(size){
      editor.focus();
      if(!restoreSelection()) return;
      document.execCommand("fontSize", false, "7");
      editor.querySelectorAll('font[size="7"]').forEach(font => {
        font.removeAttribute("size");
        font.style.fontSize = size;
      });
      notifyFormattingChange();
    }

    function updateMeta(){
      const syncMeta = USE_SUPABASE && !syncError ? `서버 · ${workspace_id.slice(0,8)}` : "로컬";
      metaText.textContent = `${ymd()} · ${syncMeta}`;
    }
    function loadLocal(){
      try{
        const rich = localStorage.getItem(RICH_STORAGE_KEY);
        if(rich !== null){
          editor.innerHTML = sanitizeRichHtml(normalizeRichHtml(rich));
          return;
        }
        const plain = localStorage.getItem(STORAGE_KEY);
        if(plain !== null) editor.innerHTML = plainTextToRichHtml(plain);
      }catch(e){}
    }
    function currentPayload(){
      const normalizedHtml = normalizeRichHtml(editor.innerHTML);
      const safeHtml = sanitizeRichHtml(normalizedHtml);
      return { html:safeHtml, text:plainText() };
    }
    function persistLocal(payload){
      localStorage.setItem(RICH_STORAGE_KEY, payload.html);
      localStorage.setItem(STORAGE_KEY, payload.text);
    }
    async function saveRemote(payload, version){
      if(!USE_SUPABASE || !sbFetch) return false;
      remoteSaveInFlight += 1;
      try{
        const updatedAt = new Date().toISOString();
        const rows = await sbFetch("widget_state?on_conflict=workspace_id,widget_key", {
          method:"POST",
          body:[{ workspace_id, widget_key:NOTES_WIDGET_KEY, payload, updated_at:updatedAt }],
          prefer:"return=representation,resolution=merge-duplicates"
        });
        lastRemoteUpdatedAt = (rows && rows[0] && rows[0].updated_at) || updatedAt;
        syncedMutationVersion = Math.max(syncedMutationVersion, version);
        syncError = false;
        return true;
      }catch(err){
        syncError = true;
        console.warn("[Notes Widget] Remote save failed; local cache is safe.", err);
        return false;
      }finally{
        remoteSaveInFlight = Math.max(0, remoteSaveInFlight - 1);
        updateMeta();
      }
    }
    async function save(){
      pendingSave = false;
      status.textContent = "저장 중…";
      const payload = currentPayload();
      try{
        persistLocal(payload);
      }catch(e){
        status.textContent = "저장 실패";
        return;
      }
      localMutationVersion += 1;
      const version = localMutationVersion;
      while(remoteSaveInFlight){
        await new Promise(resolve => setTimeout(resolve, 50));
      }
      const saved = USE_SUPABASE ? await saveRemote(payload, version) : true;
      status.textContent = saved ? "저장됨" : "서버 저장 실패 · 로컬 저장됨";
      clearTimeout(save._t);
      save._t = setTimeout(() => status.textContent = saved ? "자동 저장" : "서버 저장 실패 · 로컬 저장됨", 900);
    }
    async function loadRemoteState(){
      return sbFetch("widget_state", { query:{
        select:"payload,updated_at",
        workspace_id:`eq.${workspace_id}`,
        widget_key:`eq.${NOTES_WIDGET_KEY}`,
        limit:"1"
      }});
    }
    function applyRemoteRow(row){
      const payload = row && row.payload;
      if(!payload || typeof payload !== "object") return false;
      const html = typeof payload.html === "string"
        ? sanitizeRichHtml(normalizeRichHtml(payload.html))
        : plainTextToRichHtml(payload.text || "");
      editor.innerHTML = html;
      const localPayload = { html, text:typeof payload.text === "string" ? payload.text : plainText() };
      persistLocal(localPayload);
      lastRemoteUpdatedAt = row.updated_at || lastRemoteUpdatedAt;
      savedRange = null;
      return true;
    }
    function canApplyRemote(){
      return document.activeElement !== editor && !pendingSave && !remoteSaveInFlight && localMutationVersion === syncedMutationVersion;
    }
    async function bootstrapSync(){
      if(!USE_SUPABASE || !sbFetch) return;
      try{
        const rows = await loadRemoteState();
        if(rows && rows.length){
          applyRemoteRow(rows[0]);
          syncedMutationVersion = localMutationVersion;
          syncError = false;
        }else{
          await saveRemote(currentPayload(), localMutationVersion);
        }
      }catch(err){
        syncError = true;
        console.warn("[Notes Widget] Initial remote load failed; using local cache.", err);
      }
      updateMeta();
    }
    async function refreshFromRemote(){
      if(!USE_SUPABASE || !sbFetch || remoteRefreshInFlight || !canApplyRemote()) return;
      remoteRefreshInFlight = true;
      try{
        const rows = await loadRemoteState();
        const row = rows && rows[0];
        if(row && (!lastRemoteUpdatedAt || row.updated_at > lastRemoteUpdatedAt)) applyRemoteRow(row);
        syncError = false;
      }catch(err){
        syncError = true;
        console.warn("[Notes Widget] Remote refresh failed; keeping local cache.", err);
      }finally{
        remoteRefreshInFlight = false;
        updateMeta();
      }
    }

    let t = null;
    editor.addEventListener("input", () => {
      status.textContent = "입력 중…";
      clearTimeout(t);
      pendingSave = true;
      t = setTimeout(save, 350);
    });

    document.addEventListener("selectionchange", () => {
      saveSelection();
      updateToolbarState();
    });
    editor.addEventListener("mouseup", () => { saveSelection(); updateToolbarState(); });
    editor.addEventListener("keyup", () => { saveSelection(); updateToolbarState(); });
    editor.addEventListener("paste", (e) => {
      e.preventDefault();
      document.execCommand("insertText", false, e.clipboardData.getData("text/plain"));
    });
    toolbar.addEventListener("pointerdown", (e) => {
      saveSelection();
      if(e.target.closest("button")) e.preventDefault();
    });
    toolbar.addEventListener("click", (e) => {
      const button = e.target.closest("[data-rich-command]");
      if(button) runCommand(button.dataset.richCommand);
    });
    fontSelect.addEventListener("change", () => applyFont(fontSelect.value));
    sizeSelect.addEventListener("change", () => applySize(sizeSelect.value));

    saveBtn.addEventListener("click", async () => {
      clearTimeout(t);
      pendingSave = false;
      status.textContent = "저장 중…";
      await save();
    });

    loadLocal();
    await bootstrapSync();
    updateMeta();
    status.textContent = "자동 저장";
    sizeSelect.value = "12px";

    const REMOTE_REFRESH_INTERVAL_MS = 15000;
    setInterval(() => {
      if(document.visibilityState === "visible") refreshFromRemote();
    }, REMOTE_REFRESH_INTERVAL_MS);
    document.addEventListener("visibilitychange", () => {
      if(document.visibilityState === "visible") refreshFromRemote();
    });
    window.addEventListener("focus", refreshFromRemote);
    window.addEventListener("pageshow", refreshFromRemote);
  })();
  </script>
</body>
</html>
